<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jquery form</title>
    <style>
        form{
            border: solid 2px black;
            width: 400px;
        }
        .a{
            margin-left: 10%;
        }
    </style>
</head>
<body >
    <form action="">
        <h1 style="text-align: center;">Registration Form</h1><br><br>
        <label class="a" for="name">Name :</label><br>
        <input class="a" type="text" name="name" id="name" placeholder="Enter your name"><br><br>
        <label class="a" for="email">Email :</label><br>
        <input class="a" type="email" id="email" required placeholder="Enter Email"><br><br>
        <label class="a" for="pass">Password :</label><br>
        <input class="a" type="password" name="" id="pass" required placeholder="only number"><br><br>
        <input class="a" type="submit" value="Submit here" style="background-color: green; align-items: center;">

    </form>
    
</body>
</html>
