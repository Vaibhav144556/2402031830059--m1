<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>JavaScript in body tag</title>
</head>
<body>
	<h1>In this program I learn about how to <strong>write, add and use</strong> js code in body tag</h1>

	<p id="demo">my paragraph</p>

	<button type="button" onclick="tumtum()" style="background-color: yellow;">click here!</button>

	<script>
		function tumtum(){
			document.getElementById('demo').style.fontSize='100px';
		}
	</script>
</body>
</html>
