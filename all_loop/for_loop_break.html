<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Break label</title>
</head>
<body>
	<h1>hello in this code i go to learn about how to use write break statment in for loop </h1>
	<p id="demo"></p>
	<script>
		let text="";
		for(let i=0;i<10;i++){
			if(i===7){
				break;
			}
			text += "Number :" + i + "<br>";
		document.getElementById("demo").innerHTML=text;

		}
	</script>

</body>
</html>
