<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>while loop</title>
</head>
<body>
	<h1>In this coe I learn about how to write, use while loop using js</h1>
	<p id="demo"></p>
	<script>
		let i=3, text='';
		while(i>=0 && i<10){

			text += i + '<br>'
			i++
		}
		document.getElementById('demo').innerHTML=text;
	</script>

</body>
</html>
