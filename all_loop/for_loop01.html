<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>for loop</title>
</head>
<body>
	<p id="demo"></p>
	<script>
		num='';
		for(let i=1;i<=10;i++)
		{
			// document.write(i+"<br>")
			num += i + '<br>'
		}
		document.getElementById('demo').innerHTML=num;
	</script>
</body>
</html>
