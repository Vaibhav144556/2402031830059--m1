<!DOCTYPE html>
<html>
<head>
<style>

.container{
  width: 100%;
  height: 200px;
  border: 2px solid black;
  position: relative;
  overflow: hidden;
}

.box{
  width: 100px;
  height: 100px;
  background-color: red;
  position: absolute;
  animation: movebox 5s linear infinite;
}

@keyframes movebox{
  from{
    left: 0;
  }
  to{
    left: 100%;
  }
}

</style>
</head>

<body>

<div class="container">
  <div class="box"></div>
</div>

</body>
</html>
