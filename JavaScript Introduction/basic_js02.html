<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>change text style using js</title>
</head>
<body>
	<h1>how to change text style using javascript</h1>
	<p id="demo">hello how are welcome to creart!</p>
	<button type="button" onclick="document.getElementById('demo').style.fontSize='35px'">click me for change style of above text</button>
</body>
</html>
