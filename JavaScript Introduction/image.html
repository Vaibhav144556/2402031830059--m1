<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>how to add ,change image by js</title>
</head>
<body>
    
    <h1>how to add and change img using js</h1>
    <button onclick="document.getElementById('myimage').src='light_bulb_on.png'">click me for on the bulb</button>
    <img src="bulb-off.png" id="myimage" alt="off bulb" height="100px" width="100px">
    <button onclick="document.getElementById('myimage').src='bulb-off.png'">click me for off the bulb</button>
