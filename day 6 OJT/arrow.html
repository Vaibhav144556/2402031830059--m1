<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function Example</title>
</head>
<body>

    <script>

        let welcome = (name) => {
            return `Hello & Welcome ${name}`;
        }

        console.log(welcome("Vaibhav"));

    </script>

</body>
</html>
