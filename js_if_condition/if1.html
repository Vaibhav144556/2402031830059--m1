<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript if Statement</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        let age =18;
        let text = 'you can not drive a vehicle';
        if(age>=18){
            text='you can drive';
        }
        document.getElementById('demo').innerHTML=text;
    </script>
</body>
</html>
