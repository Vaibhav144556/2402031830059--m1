<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested if</title>
</head>
<body>
    <p>In this code i learn about how to nested if statement write in javascript</p>
    <p id="demo"></p>   
    <script>
        let name="don";
        let password="don123";
        let text="dead";
        if(name=='don'){
            if(password=='don123'){
                text='you are login';
            }else{
                text='you are dead';
            }
        }
        document.getElementById('demo').innerHTML=text+ '<h1>🤯🙈🐽🦥🦂🕷️🦾👑🎲🧬🩻🥱</h1>';
    </script>
</body>
</html>
