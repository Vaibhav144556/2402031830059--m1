<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ternary if</title>
</head>
<body>
    <h1>Ternary if condition: variable = condition ? true value : false value ;</h1>
    <p id="demo"></p>
    <script>
        let age=8;
        let text = age>=18 ? 'you can vote' : 'you can not vote';
        document.getElementById('demo').innerHTML = text;
    </script>
</body>
</html>
